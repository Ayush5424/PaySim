# Production Profile Configuration
spring.datasource.url=${URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paysim_db}?sslmode=require}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=3000ms

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:paysim-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JWT Settings
app.jwt.secret=${JWT_SECRET:changeThisSecretInProduction1234567890AbCdEfGhIj}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:604800000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Rate Limiting
app.rate-limiting.enabled=true
app.rate-limiting.auth-requests-per-minute=${AUTH_RATE_LIMIT:30}
app.rate-limiting.payment-requests-per-minute=${PAYMENT_RATE_LIMIT:20}
app.rate-limiting.general-requests-per-minute=${GENERAL_RATE_LIMIT:120}

# Kafka Topic
app.kafka.topics.payment-events=${KAFKA_PAYMENT_TOPIC:paysim-payment-events}
app.kafka.topics.payment-dlq=${KAFKA_PAYMENT_DLQ_TOPIC:paysim-payment-dlq}

# HikariCP Connection Pool (Resilience for Serverless / Neon DB Cold Starts)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000


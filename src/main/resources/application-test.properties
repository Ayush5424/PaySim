# Test Profile Configuration (In-Memory H2 DB, Disabled Kafka/Redis for Unit & Concurrency Tests)
spring.datasource.url=jdbc:h2:mem:paysim_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;LOCK_TIMEOUT=15000;DEFAULT_LOCK_TIMEOUT=15000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway disabled in test profile (H2 creates schema via JPA create-drop)
spring.flyway.enabled=false

# Redis disabled / local mock mode in test
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka disabled for unit tests
spring.kafka.bootstrap-servers=localhost:9092

# JWT Settings
app.jwt.secret=dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3Jqd3R0b2tlbmdlbmVyYXRpb25wYXlzaW0xMjM0NTY3ODkwMTI=
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=86400000

# Rate Limiting disabled or high limits in test
app.rate-limiting.enabled=false
app.rate-limiting.auth-requests-per-minute=1000
app.rate-limiting.payment-requests-per-minute=1000
app.rate-limiting.general-requests-per-minute=5000

# Kafka Topic
app.kafka.topics.payment-events=paysim-payment-events-test
app.kafka.topics.payment-dlq=paysim-payment-dlq-test

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a56db">
    <title>Enter Amount — PaySim</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container page page-app">
    <header class="screen-header">
        <a href="#" id="amountBackLink" class="btn-icon" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h2>Enter Amount</h2>
        <span class="header-spacer"></span>
    </header>

    <div class="receiver-card glass-card">
        <div class="receiver-avatar" id="receiverAvatar">?</div>
        <h3 id="receiverName">—</h3>
        <p id="receiverUpi" class="receiver-upi">—</p>
    </div>

    <form id="amountForm" class="form-stack">
        <div class="input-group">
            <label for="payAmount">Amount (₹)</label>
            <input id="payAmount" type="number" min="1" step="0.01" placeholder="0.00" required inputmode="decimal">
        </div>
        <div class="amount-chips" data-target="payAmount">
            <button type="button" class="chip-btn" data-amount="100">₹100</button>
            <button type="button" class="chip-btn" data-amount="500">₹500</button>
            <button type="button" class="chip-btn" data-amount="1000">₹1,000</button>
            <button type="button" class="chip-btn" data-amount="2000">₹2,000</button>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Continue to Pay</button>
    </form>
</div>

<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
<div id="toastRoot" class="toast-root"></div>
<script src="js/common.js"></script>
<script src="js/payment-amount.js"></script>
</body>
</html>

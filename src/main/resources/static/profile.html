<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a56db">
    <title>Profile — PaySim</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container page page-app">
    <header class="screen-header">
        <a href="dashboard.html" class="btn-icon" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h2>Profile</h2>
        <span class="header-spacer"></span>
    </header>

    <div class="profile-screen">
        <div class="profile-hero glass-card">
            <div class="profile-avatar-lg" id="profileAvatar">U</div>
            <h3 id="profileName">—</h3>
            <span class="status-badge verified" id="profileStatus">Verified</span>
        </div>

        <div class="profile-details glass-card">
            <div class="detail-row">
                <span class="detail-label">Phone</span>
                <span class="detail-value" id="profilePhone">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">UPI ID</span>
                <span class="detail-value upi-copy" id="profileUpi" title="Click to copy">—</span>
            </div>
        </div>

        <div class="qr-display glass-card">
            <span class="label-sm">My QR Code</span>
            <div class="qr-image-wrap">
                <img id="profileQrImage" src="" alt="Your UPI QR code" class="hidden">
                <div id="profileQrPlaceholder" class="qr-placeholder-box">
                    <span>QR unavailable</span>
                </div>
            </div>
        </div>

        <button type="button" id="logoutBtn" class="btn btn-danger btn-block">Log Out</button>
    </div>
</div>

<nav id="bottomNav" class="bottom-nav"></nav>
<div id="toastRoot" class="toast-root"></div>
<script src="js/common.js"></script>
<script src="js/layout.js"></script>
<script src="js/profile.js"></script>
</body>
</html>

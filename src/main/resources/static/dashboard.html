<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1528">
    <title>Dashboard — PaySim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container page page-app page-dashboard">
    <header class="dash-header">
        <div class="dash-greeting">
            <span class="greeting-label" id="dashGreeting">Good day,</span>
            <h1 id="dashUserName">User</h1>
        </div>
        <a href="profile.html" class="avatar-btn" id="dashAvatar" aria-label="Open profile">U</a>
    </header>

    <!-- Balance preview card -->
    <div class="balance-preview-card">
        <div class="balance-preview-top">
            <span class="balance-preview-label">Total Balance</span>
            <button class="balance-eye-btn" id="balanceEyeBtn" aria-label="Toggle balance visibility" type="button">
                <svg id="eyeIconShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eyeIconHide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>
        <p class="balance-preview-amount masked" id="dashBalanceAmount">₹12,500.00</p>
        <button class="balance-preview-upi" id="dashUpiCopyBtn" type="button" aria-label="Copy UPI ID">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            <span id="dashUpiId">—</span>
        </button>
        <div class="balance-preview-actions">
            <a href="pay-phone.html" class="balance-action-send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Send Money
            </a>
            <a href="pay-qr.html" class="balance-action-send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                Scan QR
            </a>
            <a href="transactions.html" class="balance-action-history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                History
            </a>
        </div>
    </div>

    <div class="section-label">Quick Actions</div>
    <div class="quick-actions-grid">
        <a href="pay-qr.html" class="action-card">
            <div class="action-icon action-icon-qr">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            </div>
            <span>Scan &amp; Pay</span>
        </a>
        <a href="pay-phone.html" class="action-card">
            <div class="action-icon action-icon-phone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            </div>
            <span>Pay</span>
        </a>
        <a href="balance.html" class="action-card">
            <div class="action-icon action-icon-balance">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
            </div>
            <span>Balance</span>
        </a>
        <a href="transactions.html" class="action-card">
            <div class="action-icon action-icon-history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <span>History</span>
        </a>
        <a href="profile.html" class="action-card">
            <div class="action-icon action-icon-profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span>Profile</span>
        </a>
    </div>

    <div class="section-label" style="margin-top: 8px;">Recent Activity</div>
    <div id="dashRecentTxns" class="recent-txn-list">
        <!-- Skeleton loaders shown until JS replaces them -->
        <div class="skeleton-txn" aria-hidden="true">
            <div class="skeleton skeleton-avatar"></div>
            <div class="skeleton-txn-body">
                <div class="skeleton skeleton-line w-60"></div>
                <div class="skeleton skeleton-line w-40"></div>
            </div>
        </div>
        <div class="skeleton-txn" aria-hidden="true">
            <div class="skeleton skeleton-avatar"></div>
            <div class="skeleton-txn-body">
                <div class="skeleton skeleton-line w-80"></div>
                <div class="skeleton skeleton-line w-40"></div>
            </div>
        </div>
    </div>
</div>

<nav id="bottomNav" class="bottom-nav"></nav>
<div id="toastRoot" class="toast-root"></div>
<script src="js/common.js"></script>
<script src="js/layout.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>

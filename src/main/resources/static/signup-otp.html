<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a56db">
    <title>Verify OTP — PaySim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-auth-body">

<div class="ambient-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<div class="app-container page page-auth">
    <header class="screen-header">
        <a href="signup.html" class="btn-icon" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h2>Verify OTP</h2>
        <span class="header-spacer"></span>
    </header>

    <div class="auth-content">
        <p class="screen-subtitle">Enter the code sent to <strong id="signupOtpPhone">+91 --------</strong></p>
        <p class="otp-hint">Check your Spring Boot console for the OTP in this simulation</p>
        <form id="signupOtpForm" class="form-stack">
            <div class="otp-input-group">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp="signup" aria-label="Digit 1">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp="signup" aria-label="Digit 2">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp="signup" aria-label="Digit 3">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp="signup" aria-label="Digit 4">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp="signup" aria-label="Digit 5">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-otp="signup" aria-label="Digit 6">
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Verify OTP</button>
            <button type="button" id="resendSignupOtp" class="btn btn-text">Resend OTP</button>
        </form>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
<div id="toastRoot" class="toast-root"></div>
<script src="js/common.js"></script>
<script src="js/signup-otp.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1528">
    <title>Log In — PaySim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-auth-body">

<div class="ambient-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<div class="app-container page page-auth">
    <header class="screen-header">
        <a href="index.html" class="btn-icon" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h2>Log In</h2>
        <span class="header-spacer"></span>
    </header>

    <div class="auth-content">
        <p class="screen-subtitle">Enter your registered details</p>
        <form id="loginForm" class="form-stack">
            <div class="input-group">
                <label for="loginName">Full Name</label>
                <input id="loginName" name="name" type="text" placeholder="Your name" required autocomplete="name">
            </div>
            <div class="input-group">
                <label for="loginPhone">Mobile Number</label>
                <div class="phone-input-wrap">
                    <span class="phone-prefix">+91</span>
                    <input id="loginPhone" name="phoneNumber" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" required autocomplete="tel">
                </div>
            </div>
            <div class="input-group">
                <label for="loginPin">UPI PIN <span style="font-weight:400;opacity:0.6">(optional if using verified name & phone)</span></label>
                <div class="pin-input-wrap">
                    <input id="loginPin" name="pin" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 digit PIN" autocomplete="current-password">
                    <button type="button" class="pin-toggle-btn" id="toggleLoginPin" aria-label="Toggle PIN visibility">
                        <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Log In</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
<div id="toastRoot" class="toast-root"></div>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>

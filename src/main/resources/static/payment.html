<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#123b3b">
    <title>Confirm Payment — PaySim</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container page page-app">
    <header class="screen-header">
        <a href="payment-amount.html" class="btn-icon" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h2>Confirm Payment</h2>
        <span class="header-spacer"></span>
    </header>

    <div class="pin-screen">
        <h3>Enter UPI PIN</h3>
        <p class="pin-summary">Paying <strong id="pinAmount">₹0</strong> to <strong id="pinReceiver">—</strong></p>
        <div class="pin-dots" id="paymentPinDots">
            <span></span><span></span><span></span><span></span>
        </div>
        <input type="password" id="paymentPinInput" class="pin-hidden-input" inputmode="numeric" maxlength="6" autocomplete="off">
        <div class="pin-keypad" data-pin-target="paymentPinInput">
            <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
            <button type="button" data-key="clear" class="key-clear">⌫</button><button type="button" data-key="0">0</button>
            <button type="button" data-key="pay" class="key-pay">Pay</button>
        </div>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
<div id="toastRoot" class="toast-root"></div>
<script src="js/common.js"></script>
<script src="js/payment.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a56db">
    <title>Scan &amp; Pay — PaySim</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container page page-app">
    <header class="screen-header">
        <a href="dashboard.html" class="btn-icon" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h2>Scan &amp; Pay</h2>
        <span class="header-spacer"></span>
    </header>

    <div id="qrReader" class="qr-scanner"></div>
    <p class="scanner-hint">Point your camera at a UPI QR code</p>
    <button type="button" id="manualQrBtn" class="btn btn-glass btn-block">Enter UPI ID manually</button>
</div>

<nav id="bottomNav" class="bottom-nav"></nav>
<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
<div id="toastRoot" class="toast-root"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/common.js"></script>
<script src="js/layout.js"></script>
<script src="js/pay-qr.js"></script>
</body>
</html>

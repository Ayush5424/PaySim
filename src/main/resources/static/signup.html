<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#123b3b">
    <title>Sign Up — PaySim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-auth-body">

<div class="ambient-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<div class="app-container page page-auth">
    <header class="screen-header">
        <a href="index.html" class="btn-icon" aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h2>Sign Up</h2>
        <span class="header-spacer"></span>
    </header>

    <div class="auth-content">
        <p class="screen-subtitle">Enter your mobile number to get started</p>
        <form id="signupPhoneForm" class="form-stack">
            <div class="input-group">
                <label for="signupPhone">Mobile Number</label>
                <div class="phone-input-wrap">
                    <span class="phone-prefix">+91</span>
                    <input id="signupPhone" name="phoneNumber" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" required autocomplete="tel">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Send OTP</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div></div>
<div id="toastRoot" class="toast-root"></div>
<script src="js/common.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
